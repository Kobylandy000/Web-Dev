<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>

    <form (ngSubmit)="onSubmit()">
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Username"
        required
      />

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
      />

      <button type="submit">Login</button>
    </form>

    <p class="message">{{ message }}</p>
  </div>
</div>
