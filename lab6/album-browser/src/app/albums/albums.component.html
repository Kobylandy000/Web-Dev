<div class="albums-container">
  <!-- Loading индикатор -->
  <div *ngIf="loading" class="loading">
    <p>Loading albums...</p>
  </div>

  <!-- Негізгі контент -->
  <div *ngIf="!loading">
    <!-- Басқару панелі -->
    <div class="controls">
      <button (click)="showOnlyFavorites = !showOnlyFavorites">
        {{ showOnlyFavorites ? 'Show All' : 'Show Favorites' }}
      </button>
      <span>Favorites: {{ favoriteCount }}</span>
    </div>

    <!-- Альбомдар тізімі -->
    <ul>
      <li *ngFor="let album of visibleAlbums">
        <a [routerLink]="['/albums', album.id]">
          {{ album.title }}
        </a>
        <button (click)="toggleFavorite(album.id, $event)">
          {{ isFavorite(album.id) ? '★' : '☆' }}
        </button>
        <button (click)="deleteAlbum(album.id, $event)">Delete</button>
      </li>
    </ul>
  </div>
</div>
