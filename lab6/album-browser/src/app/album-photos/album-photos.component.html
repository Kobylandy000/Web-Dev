<div class="photos-container">
  <!-- Loading индикатор -->
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading photos...</p>
  </div>

  <!-- Фотосуреттер жоқ болса -->
  <div *ngIf="!loading && photos.length === 0" class="empty-state">
    <p>No photos found for this album</p>
    <a routerLink="/albums/{{albumId}}" class="back-btn">← Back to Album</a>
  </div>

  <!-- Фотосуреттер торы -->
  <div *ngIf="!loading && photos.length > 0" class="photos-grid">
    <div *ngFor="let photo of photos" class="photo-card">
      <img [src]="photo.thumbnailUrl" [alt]="photo.title" class="photo-thumbnail">
      <p class="photo-title">{{ photo.title }}</p>
    </div>
  </div>

  <!-- Артқа батырмасы -->
  <div class="navigation" *ngIf="!loading">
    <a routerLink="/albums/{{albumId}}" class="back-btn">← Back to Album</a>
  </div>
</div>
